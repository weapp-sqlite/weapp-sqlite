name: CI

on:
  # push:
  #   branches: ['main']
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

env:
  LEFTHOOK: 0

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.23.4, 24.22.1]
    runs-on: ${{ matrix.os }}
    # Remote Caching enabled - configure TURBO_TOKEN and TURBO_TEAM in repository settings
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository automation
        run: pnpm exec repo config validate && pnpm exec repo doctor --rules nightly-workflow,nightly-provider,nightly-schedule,nightly-cli --strict --json

      # Node 22 compatibility coverage does not need to match the default .nvmrc version.
      - name: Check default development environment
        if: ${{ matrix.node-version == '24.22.1' }}
        run: pnpm exec repo doctor --json

      - name: Check brand assets
        run: pnpm brand:check

      - name: Test release tooling
        run: pnpm test:release

      - name: Security Audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        if: ${{ matrix.os != 'windows-latest' || matrix.node-version != '22.23.4' }}
        run: pnpm typecheck

      - name: Typecheck (Windows Node 22)
        if: ${{ matrix.os == 'windows-latest' && matrix.node-version == '22.23.4' }}
        run: pnpm exec turbo run typecheck --concurrency=1 && pnpm exec tsc -p tsconfig.acceptance.json

      - name: TSD
        run: pnpm tsd

      - name: Test
        run: pnpm test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  web-acceptance:
    name: Web Acceptance
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build acceptance targets
        run: pnpm acceptance:build

      - name: Run Web acceptance
        run: pnpm acceptance:web

      - name: Upload Web acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-acceptance-${{ github.sha }}
          path: |
            artifacts/acceptance/**
            test-results/**
          if-no-files-found: warn
