<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">weapp-sqlite</title>
  <desc id="desc">A mini program window containing a SQLite database cylinder</desc>
  <defs>
    <linearGradient id="background" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102a43"/>
      <stop offset="1" stop-color="#071521"/>
    </linearGradient>
    <linearGradient id="window" x1="106" y1="90" x2="416" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65e6c2"/>
      <stop offset="1" stop-color="#29b6c9"/>
    </linearGradient>
    <linearGradient id="database" x1="174" y1="180" x2="338" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4ff85"/>
      <stop offset="1" stop-color="#36c875"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#background)"/>
  <rect x="96" y="112" width="320" height="302" rx="48" fill="#071b29" stroke="url(#window)" stroke-width="16"/>
  <path d="M104 174h304" stroke="url(#window)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="132" cy="143" r="8" fill="#65e6c2"/>
  <circle cx="162" cy="143" r="8" fill="#65e6c2" opacity=".72"/>
  <circle cx="192" cy="143" r="8" fill="#65e6c2" opacity=".46"/>

  <g filter="url(#shadow)">
    <path d="M174 222c0-22 37-40 82-40s82 18 82 40v132c0 22-37 40-82 40s-82-18-82-40V222Z" fill="url(#database)"/>
    <ellipse cx="256" cy="222" rx="82" ry="40" fill="#c4ff85"/>
    <ellipse cx="256" cy="222" rx="58" ry="24" fill="#3f9e68" opacity=".56"/>
    <path d="M174 266c0 22 37 40 82 40s82-18 82-40M174 310c0 22 37 40 82 40s82-18 82-40" fill="none" stroke="#157b63" stroke-width="10" opacity=".7"/>
    <path d="M214 222h84" stroke="#efffd1" stroke-width="9" stroke-linecap="round" opacity=".88"/>
  </g>

  <path d="m126 356 30 30m230-30-30 30" stroke="#65e6c2" stroke-width="10" stroke-linecap="round"/>
